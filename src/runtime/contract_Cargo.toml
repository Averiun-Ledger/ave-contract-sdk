[package]
name = "contract"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ave-contract-sdk = { path = "/home/ale/dev/ave-contract-sdk", version = "0.8.0" }
# ave-contract-sdk = "0.8.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lib]
crate-type = ["cdylib"]

