[package]
name = "ave-contract-sdk"
version = "0.6.0"
edition = "2024"
authors = ["Averiun Ledger, SL <info@averiun.com>"]
description = "Ave contract SDK"
readme = "README.md"
homepage = "https://www.averiun.com"
repository = "https://github.com/Averiun-Ledger/ave-contract-sdk"
license = "AGPL-3.0-only"
keywords = ["blockchain", "distributed-ledger", "Averiun", "sustainability"]
rust-version = "1.90.0"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
borsh = { version = "1.5.7", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "basic-example"
path = "./example"